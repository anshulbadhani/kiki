[project]
name = "kiki"
version = "0.1.0"
description = "A small, moody AI that lives on your screen."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyqt6>=6.11.0",
    "python-dotenv>=1.2.2",
    "python-xlib>=0.33",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
