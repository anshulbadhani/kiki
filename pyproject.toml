[project]
name = "kiki"
version = "0.1.0"
description = "A small, moody AI that lives on your screen."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.2.0",
    "pyqt6>=6.11.0",
    "python-dotenv>=1.2.2",
    "python-xlib>=0.33",
    "onnxruntime>=1.18.0",
    "tokenizers>=0.19.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",          # screenshots
    "pyperclip>=1.8.0",        # clipboard
    "plyer>=2.1.0",            # notifications
    # Gemini vision
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "huggingface-hub>=0.23.0",  # only needed for setup.py
]
